[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "ansicli"
version = "0.0.1"
authors = [
  { name="Unwholly", email="" },
]
description = "ANSI CLI stuff"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.url]
Homepage = "https://github.com/unwholly/ansicli"
Issues = "https://github.com/unwholly/ansicli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ansicli"]